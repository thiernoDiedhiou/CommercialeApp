# ── Nginx — Phase 2 : Sous-domaines wildcard ──────────────────────────────────
#
# Prérequis Digital Ocean :
#   1. DNS wildcard : *.didisphere.shop → IP serveur  (panel DO → Networking → Domains)
#   2. SSL wildcard : sudo certbot certonly --dns-digitalocean -d didisphere.shop -d *.didisphere.shop
#
# Ce fichier gère boutique-fatou.didisphere.shop → redirige vers /shop/boutique-fatou
# Ajouter APRÈS le bloc server principal (didisphere.shop).
# ──────────────────────────────────────────────────────────────────────────────

# ── Wildcard subdomain (boutique-fatou.didisphere.shop) ───────────────────────
server {
    listen 443 ssl;
    server_name ~^(?P<slug>[a-z0-9-]+)\.didisphere\.shop$;

    ssl_certificate     /etc/letsencrypt/live/didisphere.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/didisphere.shop/privkey.pem;

    root /var/www/saas-commercial/frontend/dist;
    index index.html;

    # Sert la SPA React — le frontend détecte le sous-domaine via useDomainTenant.ts
    # et redirige vers /shop/$slug via ShopDomainEntry.tsx
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Proxy vers le backend Laravel pour les appels API
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    disable_symlinks off;
}

# ── HTTP → HTTPS pour les sous-domaines ──────────────────────────────────────
server {
    listen 80;
    server_name ~^(?P<slug>[a-z0-9-]+)\.didisphere\.shop$;
    return 301 https://$host$request_uri;
}


# ── Phase 3 : Domaine custom client (shop.boutique-fatou.sn) ──────────────────
