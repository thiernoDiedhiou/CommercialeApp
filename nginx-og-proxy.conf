# ── Configuration Nginx — OG Proxy pour les crawlers sociaux ──────────────────
#
# À ajouter dans le bloc server {} du frontend (didisphere.shop).
# Les crawlers WhatsApp / Facebook / Twitter ne voient pas la SPA React —
# ce bloc les redirige vers le backend Laravel qui retourne le bon HTML OG.
#
# Remplacer https://api.didisphere.shop par l'URL réelle de votre backend.
# ──────────────────────────────────────────────────────────────────────────────

# Détection des bots sociaux connus
map $http_user_agent $is_social_bot {
    default                       0;
    "~*facebookexternalhit"       1;
    "~*Facebot"                   1;
    "~*WhatsApp"                  1;
    "~*Twitterbot"                1;
    "~*LinkedInBot"               1;
    "~*TelegramBot"               1;
    "~*Slackbot"                  1;
    "~*Discordbot"                1;
    "~*Pinterest"                 1;
    "~*redditbot"                 1;
}

server {
    listen 443 ssl;
    server_name didisphere.shop;

    root /var/www/saas-commercial/frontend/dist;
    index index.html;

    # ── OG Proxy — pages boutique pour bots sociaux ───────────────────────────
    location ~ ^/shop/([^/]+)(/catalog)?$ {
        if ($is_social_bot) {
            # Reconstruit le chemin : /shop/{slug} → /api/v1/public/og/{slug}
            #                         /shop/{slug}/catalog → /api/v1/public/og/{slug}/catalog
            rewrite ^/shop/([^/]+)$ /api/v1/public/og/$1 break;
            rewrite ^/shop/([^/]+)/catalog$ /api/v1/public/og/$1/catalog break;
            proxy_pass https://api.didisphere.shop;
            proxy_set_header Host api.didisphere.shop;
        }
        # Vrais utilisateurs → SPA React
        try_files $uri $uri/index.html /index.html;
    }

    # ── Fallback SPA pour toutes les autres routes ────────────────────────────
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # ── Fichiers statiques ─────────────────────────────────────────────────────
    location /storage {
        try_files $uri =404;
    }

    disable_symlinks off;
}
