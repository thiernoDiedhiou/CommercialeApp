<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fond bleu DiDi Sphere -->
  <rect width="1200" height="630" fill="#2465ED"/>

  <!-- Décoration : cercles subtils en arrière-plan -->
  <circle cx="1100" cy="80"  r="160" fill="#3a78f5" opacity="0.35"/>
  <circle cx="100"  cy="560" r="120" fill="#1a52c4" opacity="0.40"/>
  <circle cx="1050" cy="550" r="90"  fill="#1a52c4" opacity="0.30"/>

  <!-- Logo sur fond blanc arrondi -->
  <rect x="424" y="100" width="352" height="160" rx="16" ry="16" fill="white"/>
  <image href="/logo_mode_claire.svg" x="444" y="118" width="312" height="124"/>

  <!-- Tagline principale -->
  <text
    x="600" y="360"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54"
    font-weight="bold"
    fill="white"
    text-anchor="middle"
    letter-spacing="-0.5"
  >Gérez votre commerce. Tout-en-un.</text>

  <!-- Sous-titre -->
  <text
    x="600" y="445"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    fill="rgba(255,255,255,0.88)"
    text-anchor="middle"
  >Essai gratuit 21 jours · Sans carte bancaire</text>

  <!-- Badge url -->
  <rect x="450" y="510" width="300" height="48" rx="24" fill="rgba(255,255,255,0.18)"/>
  <text
    x="600" y="541"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="20"
    fill="white"
    text-anchor="middle"
    letter-spacing="0.5"
  >didisphere.shop</text>
</svg>
